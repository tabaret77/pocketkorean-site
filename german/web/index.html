.lvbar{flex:1;height:10px;border-radius:999px;background:var(--soft);position:relative;overflow:hidden}.lvbar span{position:absolute;left:0;top:0;bottom:0;border-radius:999px}

/* 시작 화면: 검은 바탕 — 빨간 단어 카드(Ä)가 돌며 흰 주머니에서 솟아오르고, 바느질 선이 흘러요 (Pocket Korean과 같은 구성) */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,5vh,40px);overflow:hidden;cursor:pointer;background:#151515;color:#fff;transition:opacity .85s ease,transform .85s ease;padding:0 24px}
#splash .pksp{width:min(58vw,240px);height:auto;display:block;overflow:visible;margin-top:-4vh}
#splash .pkpo{opacity:0;transform:translateY(40px);animation:pkPo .6s cubic-bezier(.2,.8,.2,1) .05s forwards}
@keyframes pkPo{to{opacity:1;transform:none}}
#splash .pktk{transform-box:fill-box;transform-origin:50% 50%;opacity:0;transform:translateY(90px) rotate(-200deg) scale(.6);animation:pkTk 1s cubic-bezier(.2,.75,.25,1) .45s forwards}
@keyframes pkTk{40%{opacity:1}to{opacity:1;transform:none}}
#splash .pkst{stroke-dashoffset:0;animation:pkSt 2.4s linear 1.5s infinite}
@keyframes pkSt{to{stroke-dashoffset:-24}}
#splash .splt{text-align:center;opacity:0;transform:translateY(10px);animation:spT .7s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
#splash .splt b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(36px,12vw,62px);line-height:1.05;letter-spacing:-.03em;color:#fff}
#splash .splt b span{color:#FFCE00}
#splash .splt small{display:block;margin-top:12px;font-size:16px;font-weight:600;color:#CFCFCF;letter-spacing:.02em;line-height:1.5}
#splash .spfl{display:flex;justify-content:center;margin-top:16px}#splash .spfl i{width:26px;height:4px}
@keyframes spT{to{opacity:1;transform:none}}
#splash .sptap{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;font-size:14px;font-weight:700;opacity:0;animation:spH .5s 1.6s forwards,spP 1.6s 2.1s ease-in-out infinite}
@keyframes spH{to{opacity:.8}}@keyframes spP{0%,100%{opacity:.8}50%{opacity:.4}}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash .pkpo,#splash .pktk,#splash .pkst,#splash .splt,#splash .sptap{animation-duration:.01s;animation-delay:0s;animation-iteration-count:1}}
.errlog{white-space:pre-wrap;font-size:12.5px;background:var(--soft);border-radius:10px;padding:10px;max-height:200px;overflow:auto}.act .ic{font-size:19px;line-height:1;display:inline-block;transition:color .2s}
.act{transition:transform .08s ease,background-color .15s ease,box-shadow .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.act:active{transform:scale(.95);box-shadow:inset 0 2px 6px rgba(0,0,0,.12)}
.act.star.on{background:#FFF3C4;border:2px solid var(--star);color:#1B2433}
.act.star.on .ic{color:var(--star)}
.act.done.on{background:var(--ok-strong);border:2px solid var(--ok-strong);color:#fff}.act.done.on .ic{color:#fff}
.act.pop .ic{animation:actPop .5s cubic-bezier(.3,1.6,.5,1)}
.act.pop{animation:actPress .35s ease}
@keyframes actPop{0%{transform:scale(.5)}45%{transform:scale(1.55) rotate(-14deg)}100%{transform:scale(1)}}
@keyframes actPress{0%{transform:scale(1)}30%{transform:scale(.95)}100%{transform:scale(1)}}

/* ===== Design pass: Karteikarte desk — calm paper, CEFR bands as color, softer depth ===== */
:root{--bA:#1C8C74;--bB:#2D5BD3;--bC:#7A4FC4;--lift:0 1px 0 rgba(27,36,51,.05),0 14px 32px -22px rgba(27,36,51,.42);--line:rgba(27,36,51,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bA:#4CC3A6;--bB:#7FA2F5;--bC:#B08CF0;--lift:0 1px 0 rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.8);--line:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--bA:#4CC3A6;--bB:#7FA2F5;--bC:#B08CF0;--lift:0 1px 0 rgba(0,0,0,.35),0 14px 32px -20px rgba(0,0,0,.8);--line:rgba(255,255,255,.06)}
header.top{padding-block:4px 8px}
.brand{font-size:24px}
.hdr-r{gap:6px}
.gear{width:38px;height:38px;background:var(--card);box-shadow:var(--lift);color:var(--ink)}
.gear svg{width:20px;height:20px}
/* level chips */
.lvchips{display:grid;grid-template-columns:repeat(6,1fr) auto;gap:6px;margin:2px 0 12px}
.lvchips[hidden]{display:none}
/* 처음 화면: 큰 버튼은 눌리는 느낌(입체 그림자·아이콘·›), 아래 정보는 납작한 카드 */
.startrow .gohome.big{position:relative;padding-left:64px!important;padding-right:52px!important;align-items:flex-start;text-align:left;transition:transform .08s,box-shadow .08s}
.startrow .gohome.big .bic{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;font-style:normal;font-size:22px;border-radius:14px;background:rgba(255,255,255,.18)}
.startrow .gohome.big .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:22px;line-height:1;font-weight:800;background:rgba(255,255,255,.22)}
.startrow .gohome.big.primary{box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 62%,#000),0 14px 24px -12px var(--accent)!important}
.startrow .gohome.big:not(.primary){box-shadow:inset 0 0 0 2px var(--accent),0 5px 0 color-mix(in srgb,var(--accent) 35%,var(--rule)),var(--lift)!important}
.startrow .gohome.big:not(.primary) .bic{background:var(--soft)}.startrow .gohome.big:not(.primary) .chev{background:var(--accent);color:var(--accent-ink)}
.startrow.passed .msstart:not(.primary){box-shadow:inset 0 0 0 2px var(--ok),0 5px 0 color-mix(in srgb,var(--ok) 40%,var(--rule))!important}.startrow.passed .msstart .chev{background:var(--ok)!important}
.startrow .gohome.big:active{transform:translateY(4px)}.startrow .gohome.big.primary:active{box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 62%,#000)!important}
.freebox .free{border-radius:18px 18px 0 0!important}.freebox{margin-bottom:6px}
.startrow .freebox .gohome.big:not(.primary){box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent),inset 0 2px 0 var(--accent)!important}
.startrow .freebox .gohome.big.primary{box-shadow:none!important}.startrow .freebox .gohome.big:active{transform:none}
.freebox .freelv{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent),inset 0 -2px 0 var(--accent),0 5px 0 color-mix(in srgb,var(--accent) 35%,var(--rule))!important;padding-top:10px}
.freebox.hot .freelv{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent),inset 0 -2px 0 var(--accent),0 5px 0 color-mix(in srgb,var(--accent) 62%,#000)!important}
.hero.home1,.hcard.daily{background:transparent;box-shadow:none!important;border:1.5px solid var(--rule)}
.hero.home1 .st.hot{background:color-mix(in srgb,var(--card) 70%,transparent)}

.lvchips.lvmini{display:block;margin:0 0 8px;text-align:right}.lvnow{font-size:14px;color:var(--muted)}.lvnow b{color:var(--accent);font-weight:700}
.freepick{grid-column:1/-1;background:var(--card);border-radius:18px 0 18px 18px;padding:12px 12px 10px;margin-top:-10px;box-shadow:inset 0 0 0 1.5px var(--accent);position:relative;z-index:1}
.freepick .lvchips{margin:0}.freepick p{margin:8px 2px 0;font-size:14px;font-weight:700;color:var(--ink)}.freepick p small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}
.startrow .free.open,.startrow .free.open:not(.primary){position:relative;z-index:2;background:var(--card);color:var(--accent);border-radius:18px 18px 0 0;box-shadow:inset 1.5px 0 0 var(--accent),inset -1.5px 0 0 var(--accent),inset 0 1.5px 0 var(--accent);padding-bottom:16px!important}
.startrow .free.open::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:14px;background:var(--card);box-shadow:inset 1.5px 0 0 var(--accent),inset -1.5px 0 0 var(--accent)}

.lvchips button{--bc:var(--bB);height:34px;border:0;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule);font-family:var(--display);font-weight:800;font-size:15.5px;letter-spacing:.02em;color:var(--muted);position:relative;transition:background .15s,color .15s,box-shadow .15s,transform .08s}
.lvchips button::after{content:"";position:absolute;left:30%;right:30%;bottom:5px;height:2.5px;border-radius:2px;background:var(--bc);opacity:.55}
.lvchips .bA{--bc:var(--bA)}.lvchips .bB{--bc:var(--bB)}.lvchips .bC{--bc:var(--bC)}
.lvchips button[aria-pressed="true"]{background:var(--bc);color:#fff;box-shadow:0 8px 16px -10px var(--bc)}
.lvchips button[aria-pressed="true"]::after{background:#fff;opacity:.7}
.lvchips button:active{transform:scale(.95)}
.lvchips .blog{width:auto;padding:0 10px;font-size:14px;letter-spacing:0;--bc:var(--margin)}
.lvchips .blog::after{display:none}
/* primary + cards */
.primary{border-radius:20px;box-shadow:0 14px 26px -14px var(--accent),inset 0 -2px 0 rgba(0,0,0,.12)}
.primary:active{transform:translateY(1px)}
.hero,.hcard{border-radius:20px;box-shadow:var(--lift);border:1px solid var(--line)}
.stats3>div{border:0;background:var(--soft)}
.st.hot{border:0}
.week i{border-width:2px}
.card{box-shadow:var(--lift);border:1px solid var(--line)}
.act{border-radius:14px;box-shadow:var(--lift);border:1px solid var(--line)}
/* tab bar */
nav.tabs{background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line)}
nav.tabs button svg{transition:transform .15s}
nav.tabs button[aria-current="page"] svg{transform:translateY(-1px)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:5px;left:50%;width:44px;height:28px;margin-left:-24px;border-radius:999px;background:var(--soft);z-index:-1}

.backstudy{display:flex;align-items:center;gap:6px;width:100%;margin:0 0 12px;padding:12px 14px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--lift);border:1px solid var(--line);color:var(--accent);font-weight:700;font-size:15.5px;text-align:left}
.backstudy small{margin-left:auto;color:var(--muted);font-weight:500;font-family:var(--display);font-size:14px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== onboarding ===== */
#ob{position:fixed;inset:0;z-index:90;word-break:keep-all;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.obin{max-width:520px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column;gap:12px;position:relative}
.obin h2{font-size:26px;margin:4px 0 0;line-height:1.3}.obin h2 em{font-style:normal;color:var(--accent)}
.obhero{margin-top:12vh;display:grid;gap:10px}.obhero>b{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em}.obhero>b span{color:var(--margin)}
.obhero p,.obsub{color:var(--muted);margin:0;font-size:17px;line-height:1.6}.obsub b{color:var(--ink)}
.obhint{font-size:14px;color:var(--muted);margin:0}
.obskip{border:0;background:transparent;color:var(--muted);font-weight:700;padding:12px;font-size:15.5px}
.obback{position:absolute;left:12px;top:calc(14px + env(safe-area-inset-top,0px));width:36px;height:36px;border:0;border-radius:50%;background:var(--card);box-shadow:var(--lift);font-size:22px;line-height:1}
.obdots{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}.obdots i{width:22px;height:5px;border-radius:3px;background:var(--rule)}.obdots i.on{background:var(--accent)}
.oblist{display:grid;gap:10px}.oblist button,.obgrid button,.obwhen button{border:0;background:var(--card);box-shadow:var(--lift);border-radius:20px;padding:14px 16px;text-align:left;display:grid;gap:2px}
.oblist button b{font-size:17px}.oblist small{color:var(--muted);font-size:14px}
.oblist button[aria-pressed="true"],.obgrid button[aria-pressed="true"],.obwhen button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--lift)}
.obgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.obgrid button{font-weight:700;font-size:17px;padding:16px 12px;text-align:center;justify-items:center}.obgrid span{font-size:26px}
.oblv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.oblv button{--bc:var(--bB);height:48px;border:0;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--rule);font-family:var(--display);font-weight:800;font-size:19px;color:var(--muted)}
.oblv .bA{--bc:var(--bA)}.oblv .bB{--bc:var(--bB)}.oblv .bC{--bc:var(--bC)}.oblv button[aria-pressed="true"]{background:var(--bc);color:#fff;box-shadow:0 8px 16px -10px var(--bc)}
.obwhen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.obwhen button{text-align:center;font-weight:700;padding:12px 4px}
.obprog{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:6px}.obprog span{display:block;height:100%;background:var(--accent);transition:width .3s}
.obcount{margin:0;color:var(--muted);font-size:14px;font-weight:700;text-align:center}
.obq{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:20px;box-shadow:var(--lift);padding:30px 16px;margin:6px 0}
.obq .word{margin:0;text-align:center}.obsay{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--rule);background:var(--card)}
.obbars{display:grid;gap:6px;background:var(--card);border-radius:20px;box-shadow:var(--lift);padding:12px 14px}
.obbars div{display:grid;grid-template-columns:28px 1fr 38px;gap:8px;align-items:center;font-size:14px}.obbars span{font-family:var(--display);font-weight:800}
.obbars i{height:9px;border-radius:6px;background:var(--soft);overflow:hidden}.obbars i b{display:block;height:100%;border-radius:6px}
.obbars b.bA{background:var(--bA)}.obbars b.bB{background:var(--bB)}.obbars b.bC{background:var(--bC)}.obbars small{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.obplan{background:var(--card);border-radius:20px;box-shadow:var(--lift);padding:14px 16px;display:grid;gap:6px;justify-items:center;text-align:center}
.obplan p{margin:0;font-weight:700;color:var(--muted);font-size:14px}.obplan small{color:var(--muted);font-size:14px}
.obstep{display:flex;align-items:center;gap:18px}.obstep button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-size:22px;font-weight:700;color:var(--accent)}
.obstep b{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.obstep b small{font-size:17px;color:var(--muted);margin-left:2px}
.obh3{margin:6px 0 0;font-size:17px}
.obvis{list-style:none;margin:0;padding:0 0 0 6px;display:grid;gap:0;position:relative}
.obvis li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
.obvis li::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--rule)}.obvis li:first-child::before{top:50%}.obvis li:last-child::before{bottom:50%}
.obvis li b{position:relative;z-index:1;width:44px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15.5px}
.obvis b.bA{background:var(--bA)}.obvis b.bB{background:var(--bB)}.obvis b.bC{background:var(--bC)}
.obvis li span{font-weight:700;font-size:17px}.obvis li small{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.obvis li.goal span{color:var(--accent)}
/* ===== mission ===== */
.msgo{border:0;background:transparent;text-align:left;padding:0;cursor:pointer}.msgo p em{font-style:normal;color:var(--muted);font-weight:700;margin-left:4px}
.mshead h2{margin-top:0}.mshead .hdate{margin:0}
.mssteps{list-style:none;padding:0;margin:4px 0 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.mssteps li.ok{color:var(--ok)}.mssteps li.ok b{background:var(--ok);color:#fff}
.mswin{display:grid;gap:2px;text-align:center;background:var(--soft);border-radius:20px;padding:12px;margin-bottom:12px}.mswin b{font-size:19px}.mswin span{color:var(--muted);font-size:14px}
.mslist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mslist button{border:0;background:var(--card);box-shadow:var(--lift);border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:1px;min-width:0}
.mslist button span{font-family:var(--display);font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mslist button small{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mslist button.seen{background:var(--soft);box-shadow:none}.mslist button.seen>span::after{content:" ✓";color:var(--ok)}
.msacts{display:grid;gap:8px;margin-top:14px}.msacts .primary{margin:0}
.ghost{border:0;background:transparent;color:var(--accent);font-weight:700;padding:12px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--rule)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.msstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.msstat>div{background:var(--soft);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;line-height:1.3}
.msstat small{font-size:12.5px;color:var(--muted);font-weight:700}.msstat b{font-family:var(--display);font-size:22px;font-weight:800}.msstat b em{font-style:normal;font-size:12.5px;color:var(--muted);margin-left:1px}

/* 버튼 테두리: 누르기 전에도 색을 살짝 */
:root{--bm-star:#FFB703;--bm-ok:#22C07A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bm-star:#FFC93C;--bm-ok:#3FD892}}
:root[data-theme="dark"]{--bm-star:#FFC93C;--bm-ok:#3FD892}
/* 안 누름: 흰 바탕 + 색 테두리 / 누름: 색으로 꽉 채움 + 그림자 */
.actions .act.star:not(.on){border:2px solid var(--bm-star);background:var(--card);color:var(--ink)}
.actions .act.star:not(.on) .ic{color:var(--bm-star)}
.actions .act.done:not(.on){border:2px solid var(--bm-ok);background:var(--card);color:var(--ok)}
.actions .act.star.on{border:2px solid var(--bm-star);background:var(--bm-star);color:#3A2600;box-shadow:0 8px 18px -10px var(--bm-star),inset 0 -3px 0 rgba(0,0,0,.12)}
.actions .act.star.on .ic{color:#3A2600}
.actions .act.done.on{border:2px solid var(--ok-strong);background:var(--ok-strong);color:#fff;box-shadow:0 8px 18px -10px var(--ok-strong),inset 0 -3px 0 rgba(0,0,0,.15)}
.actions .act.on .ic{transform:scale(1.25)}
/* 새 카드 그림 띄우기: 그림 자리에서 커지며 떠올랐다가 다시 그 자리로 */
.illpop.auto{animation:ipBg .32s ease both}
.illpop.auto .ipc{--ox:0px;--oy:0px;--os:1}
.illpop.auto .ipc{animation:ipFly .42s cubic-bezier(.2,.9,.25,1.05) both}
.illpop.auto.out{animation:ipBg .4s ease reverse both}
.illpop.auto.out .ipc{animation:ipFlyBack .42s cubic-bezier(.5,0,.75,.2) both}
@keyframes ipBg{from{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}}
@keyframes ipFly{from{transform:translate(var(--ox),var(--oy)) scale(var(--os));opacity:.4}to{transform:none;opacity:1}}
@keyframes ipFlyBack{from{transform:none;opacity:1}to{transform:translate(var(--ox),var(--oy)) scale(var(--os));opacity:0}}

/* 나의 목표: 미션 카드 안 맨 아래 */
.hm-ms .hgoal{margin-top:8px;padding:6px 12px;gap:8px;border-radius:14px;background:rgba(0,0,0,.16);box-shadow:none;color:var(--hm-ink)}
.hm-ms .hg-k{font-size:12.5px}.hm-ms .hg-v{font-size:15.5px}.hm-ms .hg-lv{font-size:14px;padding:1px 8px}.hm-ms .hg-d{font-size:12.5px;padding:2px 8px}
@media (max-width:420px){.hm-ms .hg-y{display:none}.hm-ms .hg-ys{display:inline}}
@media (max-width:360px){.hm-ms .hg-til{display:none}.hm-ms .hgoal{padding:10px 10px;gap:6px}.hm-ms .hg-k{font-size:12.5px}.hm-ms .hg-v{font-size:14px}.hm-ms .hg-lv{font-size:12.5px;padding:1px 6px}.hm-ms .hg-d{font-size:12.5px;padding:2px 6px}}
.hm-ms .hg-k{color:var(--hm-streak)}
.hm-ms .hg-v{color:var(--hm-ink)}
.hm-ms .hg-lv{background:#fff;color:var(--hm2)}
.hm-ms .hg-d{background:var(--hm-streak);color:#4A2600}
.hm-ms .hgoal.none .hg-v{color:var(--hm-ink)}.hm-ms .hg-go{color:var(--hm-streak)}

:root{--lc-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lc-ink:#11151C}}
:root[data-theme="dark"]{--lc-ink:#11151C}
/* 단어장 보기: 고른 레벨 색(A 청록 · B 파랑 · C 보라 · Blog 빨강)으로 물들기 */
.hm-free{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--lc) 13%,var(--card)) 0%,var(--card) 70%);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--lc) 35%,var(--rule)),var(--lift);transition:background .3s}
.hm-free::after{content:"";position:absolute;right:-22px;top:-26px;width:110px;height:84px;border-radius:14px;background:color-mix(in srgb,var(--lc) 10%,transparent);transform:rotate(-14deg);pointer-events:none}
.hm-free::before{content:"";position:absolute;right:6px;top:-30px;width:110px;height:84px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--lc) 22%,transparent);transform:rotate(8deg);pointer-events:none}
.hm-fmain{position:relative;z-index:1}
.hm-fic{background:var(--lc);color:var(--lc-ink);box-shadow:0 6px 14px -8px var(--lc)}
.hm-ftx b{color:var(--ink)}
.hm-ftx small{color:color-mix(in srgb,var(--lc) 55%,var(--muted))}
.hm-fgo{background:var(--lc);color:var(--lc-ink);box-shadow:0 6px 14px -8px var(--lc)}
.hm-lv{position:relative;z-index:1;background:color-mix(in srgb,var(--lc) 9%,var(--soft))}

/* 나의 목표 미터: 시작일 → 도착일 기간 중 오늘 위치 (한 달마다 눈금) */
.hm-ms .hgoal:has(.hg-meter){flex-direction:column;align-items:stretch;gap:8px}
.hg-row{display:flex;align-items:center;gap:8px;min-width:0}
.hg-meter{display:block}
.hg-tr{position:relative;display:block;height:8px;border-radius:999px;background:rgba(255,255,255,.18);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--mo) - 1.5px),rgba(255,255,255,.35) calc(100%/var(--mo) - 1.5px) calc(100%/var(--mo)))}
.hg-fill{position:absolute;left:0;top:0;bottom:0;min-width:4px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--hm-streak) 70%,#fff),var(--hm-streak))}
.hg-now{position:absolute;top:50%;width:14px;height:14px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--hm-streak),0 2px 6px rgba(0,0,0,.3)}
.hg-ml{display:flex;justify-content:space-between;gap:6px;margin-top:4px;font-size:12.5px;color:var(--hm-sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.hg-ml b{font-weight:700;color:var(--hm-ink)}
@media (max-width:360px){.hg-ml{font-size:11px}}

/* 단어 카드: 관사 색 (der 파랑 · die 빨강 · das 초록) — 왼쪽 띠, 여백선, 머리줄, 큰 관사 워터마크 */
:root{--wm-der:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%232D5BD3' fill-opacity='0.075'>der</text></svg>");--wm-die:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%23D2373A' fill-opacity='0.075'>die</text></svg>");--wm-das:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%231E8A5A' fill-opacity='0.075'>das</text></svg>")}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wm-der:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%237FA2F5' fill-opacity='0.09'>der</text></svg>");--wm-die:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%23F07A7C' fill-opacity='0.09'>die</text></svg>");--wm-das:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%235CCB95' fill-opacity='0.09'>das</text></svg>")}}
:root[data-theme="dark"]{--wm-der:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%237FA2F5' fill-opacity='0.09'>der</text></svg>");--wm-die:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%23F07A7C' fill-opacity='0.09'>die</text></svg>");--wm-das:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='230' height='104'><text x='228' y='96' text-anchor='end' font-family='Bricolage Grotesque,Arial,sans-serif' font-weight='800' font-size='118' letter-spacing='-4' fill='%235CCB95' fill-opacity='0.09'>das</text></svg>")}
.card.g-der{--gc:var(--der);--wm:var(--wm-der)}.card.g-die{--gc:var(--die);--wm:var(--wm-die)}.card.g-das{--gc:var(--das);--wm:var(--wm-das)}
.card.g-der,.card.g-die,.card.g-das{box-shadow:inset 6px 0 0 var(--gc),var(--lift);background:var(--wm) no-repeat right 10px bottom 8px,var(--card)}
.card.g-der::after,.card.g-die::after,.card.g-das::after{background:var(--gc);opacity:.55}
.card.g-der .headrow,.card.g-die .headrow,.card.g-das .headrow{border-bottom-color:var(--gc)}
/* 표제어 아래 듣기 버튼 (예문 듣기와 같은 모양) · 그림 조금 크게 */
.hwcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hwcol .word{flex:none;max-width:100%}
.exsay.hsay{margin-left:0}
.card .headrow .ill{width:92px;height:92px;align-self:center}

.illpop .ipoff{margin-top:16px;height:36px;padding:0 16px;border:1.5px solid var(--rule);border-radius:999px;background:var(--soft);color:var(--muted);font-size:14px;font-weight:700}
.illpop .ipoff:active{transform:scale(.96)}
.illpop .ipoff.ipon{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule));background:color-mix(in srgb,var(--accent) 10%,var(--card));color:var(--accent)}

.exsay{display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none}.exsay .pli{flex:none}

.hm-pat{display:flex;gap:8px;align-items:baseline;margin:10px 0 0;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--card));font-size:14px;line-height:1.45}
.hm-pat b{flex:none;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--accent);padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hm-pat span{min-width:0;font-weight:700;color:var(--ink)}

/* 미션 카드 배경: 진행 동그라미를 과녁 한가운데로 둔 동심원 (아주 옅게) */
.hm-ms{background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><circle cx='150' cy='150' r='46' fill='none' stroke='%23fff' stroke-opacity='0.11' stroke-width='10'/><circle cx='150' cy='150' r='72' fill='none' stroke='%23fff' stroke-opacity='0.09' stroke-width='12'/><circle cx='150' cy='150' r='100' fill='none' stroke='%23fff' stroke-opacity='0.075' stroke-width='14'/><circle cx='150' cy='150' r='130' fill='none' stroke='%23fff' stroke-opacity='0.06' stroke-width='16'/></svg>") no-repeat right -112px top -93px/300px 300px,repeating-linear-gradient(180deg,transparent 0 27px,var(--hm-line) 27px 28px),linear-gradient(150deg,var(--hm1),var(--hm2))}
.hm-ms .hgoal:has(.hg-meter){gap:6px}
.hm-rt b{font-size:17px}.hm-rt small{margin-top:1px;font-size:11px}
.hm-week span{font-size:11px}
.hm-top{min-height:26px}.hm-run{height:25px}

/* 7일 기록: 요일 글자를 동그라미 안에 넣어 한 줄로 */
.hm-week{padding:6px 6px}
.hm-week span{display:none}
.hm-week i{width:28px;height:28px;font-size:12.5px;font-weight:700;color:var(--hm-sub)}
.hm-week .today i{font-size:11px;letter-spacing:-.03em;color:#fff;font-weight:800}
.hm-week .on i{font-size:12.5px}
.hm-tx h2{font-size:22px}
@media (max-width:360px){.hm-week i{width:25px;height:25px}}

.hm-mid{margin:0 0 6px}.hm-ringw{width:48px;height:48px}.hm-rt b{font-size:15.5px}
.hm-week{margin-bottom:8px;padding:4px 6px}.hm-week i{width:26px;height:26px}
.hm-cta{height:38px;font-size:17px}
.hm-ms .hgoal{margin-top:6px;padding:6px 12px 6px}
.hm-top{min-height:24px}.hm-run{height:24px;font-size:12.5px}

/* ===== 2단계 디자인 리뷰 반영 ===== */
/* 1) 미션 화면 주요 버튼: 탭 바 바로 위에 항상 보이게 */
.msacts{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:14px;padding:10px 0 0;background:linear-gradient(to bottom,transparent,var(--paper) 14px)}
/* 2) 작은 버튼 키우기: 듣기 · 빼기 (누르는 영역 44px) */
.exsay{position:relative;height:30px;padding:0 12px;margin-left:6px;font-size:13px;gap:5px;border-radius:999px;border:1.5px solid var(--rule);color:var(--muted);background:var(--card)}
.exsay::before{content:"";position:absolute;inset:-7px -4px}
.exsay .pli{width:10px;height:11px}
.exsay.hsay{margin-left:0}
.item button{min-height:40px;min-width:52px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--rule)}
/* 3) 주요 버튼 통일: 높이 48 · 모서리 14 · 옅은 그림자 */
.primary{min-height:48px;padding:12px 16px;border-radius:14px;font-size:17px;box-shadow:0 6px 14px -8px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 -2px 0 rgba(0,0,0,.1)}
.primary:active{transform:translateY(1px);box-shadow:0 3px 8px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.hm-cta{border-radius:14px}
/* 4) 처음 화면 외에는 머리말을 한 줄로 작게 */
body:not([data-tab="home"]) header.top{padding-block:2px 8px}
body:not([data-tab="home"]) .brand{font-size:19px}
body:not([data-tab="home"]) .brand small{display:none}
body:not([data-tab="home"]) header.top button{width:38px;height:38px}
/* 5) 칩 통일: 하나 고르기 = 둥근 선택 칩(옅은 파랑 채움 + 파란 테두리) / 여러 개 고르기 = 같은 모양 */
.opts button,.qseg button,.qtypes button{min-height:40px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;font-weight:700;font-size:14px}
.opts button[aria-pressed="true"],.qseg button[aria-pressed="true"],.qtypes button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:var(--accent);color:var(--accent)}
.qtypes button,.qseg button{padding:8px 6px}
/* 6) 단어 카드 관사 워터마크: 더 작게 · 칩과 덜 겹치게 */
.card.g-der,.card.g-die,.card.g-das{background:var(--wm) no-repeat right 8px bottom 4px/150px auto,var(--card)}
/* 7) 통계 타일 문장 잘림 없애기 */
.sttiles span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.3}

/* 듣기 버튼 통일: 모두 같은 크기의 스피커 아이콘 (지름 36px, 누르는 영역 44px) */
.spk{position:relative;flex:none;display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:50%;border:1.5px solid var(--rule);background:var(--card);color:var(--accent);vertical-align:middle;-webkit-tap-highlight-color:transparent}
.spk::before{content:"";position:absolute;inset:-4px}
.spk:active{transform:scale(.92);background:var(--soft)}
.spk svg{width:18px;height:18px}
.hwcol .spk{margin-top:2px}
.sec h4 .spk,.sec .spk{margin-left:8px}
.hm-dq .spk{margin-top:2px}

/* ===== 3단계 접근성 반영 (WCAG 2.1 AA) ===== */
/* 글자 대비 4.5:1 이상: 밝은 화면의 관사·라벨 색을 조금 진하게 */
:root{--das:#187A4F;--die:#C4282C;--margin:#C83A2E;--ok:#187A4F;--bm-star:#E8A200}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--das:#5CCB95;--die:#F07A7C;--margin:#E8675B;--ok:#4CC08A;--bm-star:#FFC93C}}
:root[data-theme="dark"]{--das:#5CCB95;--die:#F07A7C;--margin:#E8675B;--ok:#4CC08A;--bm-star:#FFC93C}
.mssteps li.now b{color:var(--accent-ink)}
/* 누르는 영역 넓히기 (보이는 크기는 그대로, 손가락 영역 44px 안팎) */
header.top button,.hm-lv button,.hm-run,.hm-cta,.rel button,.linkbtn,[data-ssort]{position:relative}
header.top button::after{content:"";position:absolute;inset:-3px}
.hm-lv button::after{content:"";position:absolute;inset:-6px -1px}
.hm-run::after{content:"";position:absolute;inset:-10px -4px}
.hm-cta::after{content:"";position:absolute;inset:-3px 0}
.rel button::after,.linkbtn::after,[data-ssort]::after{content:"";position:absolute;inset:-9px -2px}
/* 키보드 초점 표시: 모든 누를 수 있는 요소 */
:where(a,button,[role=button],[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:inherit}
.illpop:focus{outline:none}
.hm-lv button{color:color-mix(in srgb,var(--muted) 65%,var(--ink))}

/* 표제어 머리 줄 낮추기: 스피커는 품사 옆으로, 그림 80px, 긴 단어는 한 줄에 맞게 글자를 줄여요 */
.hwcol{display:block}
.hwcol .word{width:100%}
.meta .spk-meta{width:32px;height:32px;margin-left:2px}
.meta .spk-meta svg{width:16px;height:16px}
.card .headrow .ill{width:80px;height:80px}
.word{overflow-wrap:normal;-webkit-hyphens:manual;hyphens:manual}

/* 머리 줄 더 낮추기: 그림을 위로 올려 품사 줄 옆까지, 아래 여백 줄이기 */
.card .headrow{margin-top:2px;padding-bottom:6px;align-items:flex-end}
.card .headrow .ill{align-self:flex-start;margin-top:-40px;width:78px;height:78px}
.card .meta{padding-right:84px}
.card.t1 .headrow{padding-bottom:4px}
/* 퀴즈 정답률: 카드 오른쪽 맨 위 모서리(그림 위)에 */
.card:has(.meta .qsb) .headrow .ill{margin-top:-30px}
.card .meta .qsb{position:absolute;top:4px;right:6px;margin:0;z-index:2;font-size:10.5px;line-height:1.5;padding:0 7px}
/* 북마크·암기 완료 버튼과 아래 탭바를 조금 낮게 → 단어 카드를 더 길게 */
.actions{margin-top:10px;gap:8px}
.actions .act{padding:8px 8px;min-height:52px;font-size:17.5px;font-weight:800;letter-spacing:-.01em;border-radius:13px}
.actions .act .ic{font-size:20px}
nav.tabs button{padding:7px 0 5px;gap:1px;font-size:11px}

<script>
const LANG="ko",DP=LANG==="ko"?"data/":"data_"+LANG+"/",BLOGK=LANG==="ko"?"wk_blog":"wk_blog_"+LANG,INBK=LANG==="ko"?"wk_inbox":"wk_inbox_"+LANG;
const WEB=location.protocol==="https:"&&!/appassets\./.test(location.hostname),WEBURL={ko:"/german/web/",en:"/german/web/index_en.html",ja:"/german/web/index_ja.html",tr:"/german/web/index_tr.html"};
function setLang(L){try{localStorage.setItem("wk_lang",L)}catch(e){}if(L===LANG)return;if(WEB){location.href=WEBURL[L];return}location.replace(L==="ko"?"index.html":"index_"+L+".html")}
const LEVELS=[["A1","입문"],["A2","초급"],["B1","중급"],["B2","중상급"],["C1","고급"],["C2","최상급"]];
/* ---------- 설정 (기기에 저장 + 계정에도 함께 저장) ---------- */
const PREF_DEF={turn:"curl",snd:true,rate:.85,autoSay:false,order:"random",starW:4,theme:"auto",paper:"white",ill:true,voiceSrc:"leda",notif:false,notifT:"20:00",illAnim:(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)?"off":window.MW_LITE?"draw":"full",tests:["card","mc","art","pic","cloze","spell","forms","match"],illFly:true,fs:"m"};
let PREF=Object.assign({},PREF_DEF);
/* 아이폰 앱(네이티브)으로 실행 중일 때만 쓰는 기능: 매일 알림 */
const NATIVE=!!(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.mw);
function native(msg){try{if(NATIVE)window.webkit.messageHandlers.mw.postMessage(msg)}catch(e){}}
function nativeNotify(){if(!NATIVE)return;let m=null;try{m=msToday()}catch(e){}native({type:"notify",on:!!PREF.notif,time:PREF.notifT||"20:00",done:!!(m&&m.pass),date:dkey(new Date()),n:m?m.ids.length:10})}
/* 안드로이드 뒤로 가기 버튼: 열린 그림 창 → 카드 → 이전 목록 → 처음 화면 순서로 돌아가요. 처음 화면이면 "exit" */
window.mwBack=function(){try{
  const pop=document.querySelector(".illpop:not(.out)");if(pop){pop.click();return "ok"}
  const ob=document.getElementById("ob");if(ob&&ob.isConnected&&!ob.hidden)return "exit";
  if(tab==="detail"){if(backTab==="search")backToSearch();else go(backTab||"home");return "ok"}
  if(tab!=="home"){go("home");window.scrollTo(0,0);return "ok"}
  return "exit"}catch(e){return "exit"}};
window.mwNotifyDenied=function(){PREF.notif=false;try{localStorage.setItem("wk_prefs",JSON.stringify(PREF))}catch(e){}if(tab==="settings")render();toast("설정 앱 › 포켓독일어 › 알림에서 알림을 허용해 주세요")};
try{Object.assign(PREF,JSON.parse(localStorage.getItem("wk_prefs")||"{}"));if(localStorage.getItem("wk_snd")==="0"&&!localStorage.getItem("wk_prefs"))PREF.snd=false}catch(e){}
/* 종이(배경) 색: 밝은 화면에서만 적용 [카드, 바탕, 옅은 칸] */
const PAPERS={white:["#FFFFFF","#F3F5F1","#E7ECF4","흰 종이"],cream:["#FFFBEA","#F5EFD8","#F1EAD0","연노랑"],beige:["#FBF6EC","#EEE6D6","#EAE1CE","베이지"],mint:["#F4FAF2","#E5EEE1","#E1EDDC","연초록"],sky:["#F3F8FD","#E2EBF4","#DEE8F3","연하늘"],pink:["#FDF5F5","#F2E5E5","#F0E0E0","연분홍"]};
const DARKQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function applyTheme(){const r=document.documentElement;r.style.setProperty("--cfs",({s:.9,m:1,l:1.1,xl:1.2})[PREF.fs]||1);
  if(PREF.theme==="light"||PREF.theme==="dark")r.dataset.theme=PREF.theme;else delete r.dataset.theme;
  const dark=PREF.theme==="dark"||(PREF.theme==="auto"&&DARKQ&&DARKQ.matches);const pp=PAPERS[PREF.paper]||PAPERS.white;
  if(!dark&&PREF.paper!=="white"){r.style.setProperty("--card",pp[0]);r.style.setProperty("--paper",pp[1]);r.style.setProperty("--soft",pp[2])}
  else{r.style.removeProperty("--card");r.style.removeProperty("--paper");r.style.removeProperty("--soft")}}
applyTheme();try{DARKQ&&DARKQ.addEventListener("change",applyTheme)}catch(e){}
let SEEN=new Set();try{SEEN=new Set(JSON.parse(localStorage.getItem("wk_seen")||"[]"))}catch(e){}
function saveSeen(){clearTimeout(saveSeen.t);saveSeen.t=setTimeout(()=>{try{localStorage.setItem("wk_seen",JSON.stringify([...SEEN]))}catch(e){}},500)}
let DATA={}, BYID={};
let S={levels:["A1","A2"],star:[],done:[],srs:{},qd:[],gd:[],dl:{},tt:0,lw:[],qs:{},rv:[]};
let FREEOPEN=false;
let STUDYCUR=null, tab="home", cur=null, revealed=false, recent=[];
let BLOG=[], lvMode="lv", blogDay=null, blogIdx=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1600)}

/* ---------- storage: claude db (per person) with local fallback ---------- */
let dbDoc=null, saveT=null, saving=false, pending=false;
/* 퀴즈 기록: S.qs = {단어id:[나온 횟수, 맞힌 횟수]}, 최근 본 카드: S.rv (오래된 것 → 최근) */
function qsNorm(o){if(!o.qs||typeof o.qs!=="object"||Array.isArray(o.qs))o.qs={};if(!Array.isArray(o.rv))o.rv=[];if(!o.rvt||typeof o.rvt!=="object"||Array.isArray(o.rvt))o.rvt={}}
function qsMergeIn(d,l){qsNorm(S);const a=(d&&d.qs&&typeof d.qs==="object")?d.qs:{},b=(l&&l.qs)||{};const out={};
  for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k]||[0,0],y=b[k]||[0,0];out[k]=x[0]>=y[0]?[+x[0]||0,+x[1]||0]:[+y[0]||0,+y[1]||0]}
  S.qs=out;const rv=[];for(const id of [...((d&&Array.isArray(d.rv))?d.rv:[]),...((l&&l.rv)||[])]){const i=rv.indexOf(id);if(i>=0)rv.splice(i,1);rv.push(id)}S.rv=rv.slice(-300);const ta=(d&&d.rvt&&typeof d.rvt==="object")?d.rvt:{},tb=(l&&l.rvt)||{},rt={};for(const id of S.rv){const t=Math.max(+ta[id]||0,+tb[id]||0);if(t)rt[id]=t}S.rvt=rt}
function qsBadge(w){const r=S.qs&&S.qs[w.id];if(!r||!r[0])return "";return `<span class="qsb" title="퀴즈에 ${r[0]}번 나와서 ${r[1]}번 맞혔어요">퀴즈 정답률 ${Math.round(r[1]/r[0]*100)}% (${r[1]}/${r[0]})</span>`}
function loadLocal(){try{const v=JSON.parse(localStorage.getItem("wk_state")||"null");if(v&&Array.isArray(v.star))S=Object.assign(S,v)}catch(e){}if(!S.srs||typeof S.srs!=="object")S.srs={};qsNorm(S);normStudy(S);cleanStar()}
function cleanStar(){if(!Array.isArray(S.star)||!Array.isArray(S.done))return false;const d=new Set(S.done),n=S.star.length;S.star=[...new Set(S.star)].filter(x=>!d.has(x));return n!==S.star.length}
function saveLocal(){cleanStar();syncHist();try{localStorage.setItem("wk_state",JSON.stringify(S))}catch(e){}}
function persist(){saveLocal();if(!dbDoc)return;clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){if(saving){pending=true;return}saving=true;
  try{await dbDoc.set({levels:S.levels,star:S.star,done:S.done,srs:S.srs||{},qd:S.qd,gd:S.gd,bd:S.bd||[],dl:S.dl,tt:S.tt,lw:S.lw,qs:S.qs||{},rv:S.rv||[],rvt:S.rvt||{},plan:S.plan||null,ms:S.ms||null,mh:S.mh||{},hist:S.hist||{},prefs:PREF,v:1});$("#sync").textContent="진행 상황이 내 계정에 저장돼요."}
  catch(e){$("#sync").textContent="지금은 이 기기에만 저장돼요."}
  saving=false;if(pending){pending=false;flush()}}
async function connect(){
  try{const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){$("#sync").textContent="이 기기에만 저장돼요.";return}
    const id=await user.id(); if(!id){$("#sync").textContent="이 기기에만 저장돼요.";return}
    dbDoc=db.doc("data/users/"+id+"/progress");
    const snap=await dbDoc.get();
    if(snap.exists){let d=snap.data();try{d=JSON.parse(JSON.stringify(d))}catch(e){};const _loc={plan:S.plan,ms:S.ms,mh:S.mh,hist:S.hist,qs:S.qs,rv:S.rv,rvt:S.rvt};S=mergeStudy({levels:d.levels||S.levels,star:d.star||[],done:d.done||[],srs:(d.srs&&typeof d.srs==="object")?d.srs:(S.srs||{}),qd:d.qd,gd:d.gd,bd:d.bd,dl:d.dl,tt:d.tt,lw:d.lw},S);msMerge(d,_loc);qsMergeIn(d,_loc);S.hist=_loc.hist||{};histMerge(d);if(d.prefs&&typeof d.prefs==="object"){Object.assign(PREF,d.prefs);SND=PREF.snd;applyTheme();try{localStorage.setItem("wk_prefs",JSON.stringify(PREF))}catch(e){}}if(cleanStar())persist();saveLocal();await ensureLevels();render()}
    else flush();
    $("#sync").textContent="진행 상황이 내 계정에 저장돼요.";
  }catch(e){$("#sync").textContent="이 기기에만 저장돼요."}
}

/* ---------- data ---------- */
async function getJSON(p){const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json()}
async function loadLevel(lv){if(DATA[lv])return;
  const arr=await getJSON(DP+lv+".json");DATA[lv]=arr;arr.forEach(w=>BYID[w.id]=w)}
async function ensureLevels(){await Promise.all(LEVELS.map(l=>loadLevel(l[0]).catch(()=>{})))}
/* Goethe-Wortliste 레벨 (A1–B1): 블로그 단어도 이 레벨로 분류 */
let GL={};
/* 일러스트: data/ill.json(A1–A2) + ill_B1/B2/C1/C2.json = {pics:{개념:svg}, map:{단어id:개념}} — 선택한 레벨부터 차례로 불러와요 */
let ILL={pics:{},map:{}};const ILL_DONE={};
/* 그림에 색 입히기: 흰색으로 채운 덩어리를 그림 주제에 맞는 파스텔 색으로, 사람 머리는 살구색으로 */

  if(PREF.order==="alpha"){ /* 알파벳순: 마지막으로 본 단어 다음부터 */
    const s=p.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b),"de"));let last=null;try{last=localStorage.getItem("wk_alpha")}catch(e){}
    let i=last?s.findIndex(w=>sortKey(w).localeCompare(last,"de")>0):0;if(i<0)i=0;
    try{localStorage.setItem("wk_alpha",sortKey(s[i]))}catch(e){}return s[i]}
  let base=p;
  if(PREF.order==="unseen"){const u=p.filter(w=>!SEEN.has(w.id));if(u.length)base=u}
  const st=starSet(); const cand=base.length>8?base.filter(w=>!recent.includes(w.id)):base;
  let tot=0; const ws=cand.map(w=>{const x=st.has(w.id)?PREF.starW:1;tot+=x;return x});
  let r=Math.random()*tot; for(let i=0;i<cand.length;i++){r-=ws[i];if(r<=0){remember(cand[i]);return cand[i]}}
  remember(cand[cand.length-1]);return cand[cand.length-1]}
function remember(w){recent.push(w.id);if(recent.length>8)recent.shift()}

/* ---------- 단어 검색 ---------- */
let SQ="",SSORT="de",SDIR=1,SN=0,SSCROLL=0,SRES=[];
const fold=s=>String(s).toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss");
const LVORD={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
function allWords(){const n=Object.keys(BYID).length;if(allWords.n===n)return allWords.c;
  const seen=new Set(),out=[];Object.values(BYID).forEach(w=>{if(!w||!w.de||seen.has(w.id))return;seen.add(w.id);
    out.push({w,h:fold(sortKey(w)),d:fold(w.de),k:String(w.ko||"").toLowerCase()})});
  allWords.n=n;allWords.c=out;return out}
function viewSearch(){const th=(k,t)=>`<button data-ssort="${k}" aria-pressed="${SSORT===k}">${t}${SSORT===k?(SDIR>0?" ▲":" ▼"):""}</button>`;
  return `<div class="sbar"><label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg><input id="sq" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="독일어 표제어 또는 한국어 뜻" value="${esc(SQ)}" aria-label="단어 검색"><button id="sclr" type="button" aria-label="검색어 지우기" style="${SQ?"":"visibility:hidden"}">×</button></label>
  <p class="scount" id="scount"></p><div class="shead">${th("de","표제어")}${th("ko","의미")}${th("pos","품사")}${th("lv","레벨")}</div></div><div class="slist" id="slist"></div>`}
function searchCompute(){const q=SQ.trim().toLowerCase(),fq=fold(q);const all=allWords();let res;
  const cmp={de:(a,b)=>a.h.localeCompare(b.h,"de"),ko:(a,b)=>a.k.localeCompare(b.k,"ko"),pos:(a,b)=>String(a.w.pos).localeCompare(String(b.w.pos),"ko")||a.h.localeCompare(b.h,"de"),lv:(a,b)=>(LVORD[a.w.lv]||9)-(LVORD[b.w.lv]||9)||a.h.localeCompare(b.h,"de")}[SSORT];
  if(!q){res=all.slice().sort((a,b)=>SDIR*cmp(a,b))}
  else{res=[];for(const x of all){let r=-1;
      if(x.h.startsWith(fq))r=x.h===fq?0:1;else if(x.d.includes(fq))r=2;
      else{const i=x.k.indexOf(q);if(i>=0)r=x.k.split(/[,;/]\s*/).some(t=>t.trim()===q)?2.5:(i===0||/[ ,;(·/]/.test(x.k[i-1]))?3:4}
      if(r>=0){x.r=r;res.push(x)}}
    res.sort((a,b)=>SSORT==="de"&&SDIR>0?(a.r-b.r||(a.r>=2.5?a.k.length-b.k.length:0)||cmp(a,b)):SDIR*cmp(a,b))}
  SRES=res}
function hl(t,q){t=String(t);if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))}
function rowHTML(x,q){const w=x.w;const m=w.de.match(/^(der|die|das) (.+)$/);
  const de=m?`<span class="art ${m[1]}">${m[1]}</span> ${hl(m[2],q)}`:hl(w.de,q);
  return `<button class="srow" data-open="${w.id}"><span class="sw" lang="de">${de}</span><span class="sk">${hl(w.ko||"",q)}</span><span class="sp">${esc(w.pos||"")}</span><span class="sl">${esc(w.lv||"")}</span></button>`}
const SCHUNK=150;
function searchFill(keep){const L=$("#slist");if(!L)return;searchCompute();
  const n=keep?Math.max(SN,SCHUNK):SCHUNK;SN=0;L.innerHTML="";searchMore(n);
  const c=$("#scount");if(c)c.textContent=SQ.trim()?(SRES.length?`검색 결과 ${SRES.length.toLocaleString()}개`:""):`전체 ${SRES.length.toLocaleString()}개 단어 · 표제어를 누르면 카드가 열려요`;
  if(SQ.trim()&&!SRES.length)L.innerHTML=`<div class="smore">「${esc(SQ.trim())}」에 맞는 단어가 없어요.</div>`}
function searchMore(n){const L=$("#slist");if(!L||SN>=SRES.length)return;const q=SQ.trim().toLowerCase();
  const end=Math.min(SRES.length,SN+(n||SCHUNK));let h="";for(let i=SN;i<end;i++)h+=rowHTML(SRES[i],q);SN=end;
  const old=L.querySelector(".smore");if(old)old.remove();L.insertAdjacentHTML("beforeend",h+(SN<SRES.length?`<div class="smore">↓ 더 보기</div>`:""))}
document.addEventListener("input",e=>{if(e.target.id!=="sq")return;SQ=e.target.value;const c=$("#sclr");if(c)c.style.visibility=SQ?"":"hidden";
  cancelAnimationFrame(searchFill.raf);searchFill.raf=requestAnimationFrame(()=>{searchFill(false);window.scrollTo(0,0)})});
document.addEventListener("keydown",e=>{if(e.target.id==="sq"&&e.key==="Enter")e.target.blur()});
window.addEventListener("scroll",()=>{if(tab!=="search")return;if(window.innerHeight+window.scrollY>document.documentElement.scrollHeight-900)searchMore()},{passive:true});

let FLIP=null,FLIPBUSY=false,RELIDX=null,FLIPEL=null;
function relWord(r){const n=Object.keys(BYID).length;if(!RELIDX||RELIDX.__n!==n){RELIDX={__n:n};Object.values(BYID).forEach(w=>{if(!w||!w.de)return;const k=glKey(w.de);if(!(k in RELIDX))RELIDX[k]=w})}
  return RELIDX[glKey(r.de)]||null}
function relCardWord(r){const w=relWord(r);if(w)return w;
  return {id:"rel:"+r.de,lv:"관련어",pos:"",de:r.de,ko:r.ko,forms:"",note:"이 단어는 아직 단어장에 따로 카드가 없어요."}}
function spinCard(c,dir,swap){if(FLIPBUSY)return;FLIPBUSY=true;

  const D=reduce?1:230;
  const a=c.animate([{transform:"rotateY(0deg)"},{transform:`rotateY(${-90*dir}deg)`}],{duration:D,easing:"cubic-bezier(.45,0,.9,.6)"});

/* 관련 어휘 카드로 뒤집을 때 관사 색(der 파랑 · die 빨강 · das 초록)도 그 단어에 맞게 바꿔요 */
function gSync(c,n){c.classList.remove("g-der","g-die","g-das");(n.className.match(/\bg-(der|die|das)\b/)||[]).slice(0,1).forEach(k=>c.classList.add(k))}
function cardInner(w){const t=document.createElement("div");t.innerHTML=cardHTML(w,true);return t.firstElementChild}
function flipTo(i,el){const c=(el&&el.closest(".card"))||$("#view .card");FLIPEL=c;if(!c||!cur||!cur.rel||!cur.rel[i])return;
  const w=relCardWord(cur.rel[i]);if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  spinCard(c,1,()=>{const n=cardInner(w);c.innerHTML=`<p class="relnote"><b>↩</b> ${esc(cur.de)}의 관련 어휘 · 누르면 돌아가요</p>`+n.innerHTML;gSync(c,n);c.classList.add("relcard");FLIP=w;
    refitCard(c);c.scrollTop=0})}
function unflip(){const c=FLIPEL||$("#view .card");if(!c||!FLIP)return;const back=cur;
  spinCard(c,-1,()=>{const n=cardInner(back);c.innerHTML=n.innerHTML;gSync(c,n);c.classList.remove("relcard");FLIP=null;refitCard(c)})}

/* ---------- 책장 넘기는 소리 (Web Audio로 합성, 파일 없음) ---------- */
let SND=PREF.snd;
let ACX=null,NOISE=null;
function audioInit(){ /* 터치할 때 한 번 깨워 둬야 iPhone에서 소리가 나요 */
  if(!SND)return;try{
    if(!ACX){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ACX=new C();
      const n=ACX.sampleRate*0.6|0,buf=ACX.createBuffer(1,n,ACX.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=Math.random()*2-1; /* 맑은 흰 잡음만: 낮은 웅웅거림 없이 */
      NOISE=buf}
    if(ACX.state!=="running")ACX.resume().catch(()=>{});loadFlips()}catch(e){}}
/* 짧은 '틱': 아이폰 피커처럼 가볍고 또렷한 기계식 클릭 */
function tickSound(){
  if(!SND||!ACX)return;try{
    const t=ACX.currentTime+0.003,out=ACX.createGain();out.gain.value=0.11;out.connect(ACX.destination);
    const o=ACX.createOscillator();o.type="triangle";o.frequency.setValueAtTime(2300,t);o.frequency.exponentialRampToValueAtTime(1500,t+0.025);
    const g=ACX.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.9,t+0.0015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
    o.connect(g).connect(out);o.start(t);o.stop(t+0.05);
    if(NOISE){const b=ACX.createBufferSource();b.buffer=NOISE;const hp=ACX.createBiquadFilter();hp.type="highpass";hp.frequency.value=4000;
      const g2=ACX.createGain();g2.gain.setValueAtTime(0.35,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.012);
      b.connect(hp).connect(g2).connect(out);b.start(t,Math.random()*0.3,0.02)}
  }catch(e){}}
/* 맑은 '띵': 부드럽게 울리고 금방 사라지는 작은 벨 */
function chimeSound(){
  if(!SND||!ACX)return;try{
    const t=ACX.currentTime+0.003,out=ACX.createGain();out.gain.value=0.075;out.connect(ACX.destination);
    [[1318.5,1],[1975.5,.35],[2637,.12]].forEach(([f,a])=>{const o=ACX.createOscillator();o.type="sine";o.frequency.value=f;
      const g=ACX.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g).connect(out);o.start(t);o.stop(t+0.25)})
  }catch(e){}}
/* 미션 시험 정답: 딩동 (미–도, 종소리) */
function dingSound(){
  if(!SND||!ACX)return;try{
    const t0=ACX.currentTime+0.003,out=ACX.createGain();out.gain.value=0.11;out.connect(ACX.destination);
    [[659.25,0,0.42],[523.25,0.30,0.55]].forEach(([f,d,tau])=>{
      [[1,1,tau],[2,.35,.25],[3,.12,.12]].forEach(([m,a,tt])=>{const o=ACX.createOscillator(),g=ACX.createGain();o.type="sine";o.frequency.value=f*m;
        const t=t0+d;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(a,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+tt*5);
        o.connect(g).connect(out);o.start(t);o.stop(t+tt*5+0.05)})})
  }catch(e){}}

  return `<div class="mshead"><p class="hdate">${new Date().toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"long"})}</p><h2>오늘의 미션</h2>
   <p class="sub">${(m.skip?`<span class="msskip">이미 알던 단어 ${m.skip}개는 외운 단어로 옮기고 새 단어로 바꿨어요.</span><br>`:"")+((m.rv||[]).length?`새 단어 ${n-(m.rv||[]).length}개 + <b>복습 ${(m.rv||[]).length}개</b>`:`단어 ${n}개`)}를 외우고 그 단어로 시험을 봐요. <b>${MPASS}점</b>을 넘으면 미션 성공!<br><small class="mstip">이미 아는 단어는 카드에서 <b>✓ 이미 알아요</b>를 누르면 외운 단어로 옮기고 새 단어로 바꿔 줘요.</small></p></div>
  <ol class="mssteps"><li class="${seen>=n?"ok":"now"}"><b>1</b>외우기 <small>${seen}/${n}</small></li><li class="${m.pass?"ok":stage==="test"?"now":""}"><b>2</b>시험 <small>${m.best!=null?m.best+"점":"80점 이상"}</small></li><li class="${m.pass?"ok":""}"><b>3</b>성공</li></ol>
  ${m.pass?`<div class="mswin"><b>🎉 미션 성공!</b><span>${m.best}점 · 내일 새 단어가 준비돼요</span></div>`:""}
  <div class="mslist">${m.ids.map((id,i)=>{const w=BYID[id];return `<button data-msopen="${i}" class="${m.seen.includes(id)?"seen":""}${(m.rv||[]).includes(id)?" rv":""}"><span lang="de">${headword(w.de)}</span><small>${(m.rv||[]).includes(id)?"<i>복습</i> ":""}${esc(shortKo(w))}</small></button>`}).join("")}</div>
  <div class="msacts">${m.pass?`<button class="primary" data-mstest="1">한 번 더 시험 보기</button>`:
    stage==="learn"?`<button class="primary" data-msopen="${Math.max(0,m.ids.findIndex(id=>!m.seen.includes(id)))}">${seen?"이어서 외우기":"단어 외우기 시작"} →</button><button class="ghost" data-mstest="1">바로 시험 보기</button>`:
    `<button class="primary" data-mstest="1">시험 보기 →</button><button class="ghost" data-msopen="0">한 번 더 훑어보기</button>`}</div>
  <div class="msstat"><div><small>미션 성공</small><b>${st.n}<em>회</em></b></div><div><small>연속 성공</small><b>${st.run}<em>일</em></b></div><div><small>평균 점수</small><b>${st.avg!=null?st.avg:"–"}<em>${st.avg!=null?"점":""}</em></b></div></div>
  <p class="hint" style="margin-top:10px">하루 단어 수: ${msDaily()}개 · <button class="linkbtn" data-obopen="1">목표·수준 다시 정하기</button></p>`}
function msOpen(i){const m=msToday();DSEQ=m.ids.slice();DIDX=Math.min(Math.max(0,i),DSEQ.length-1);backTab="mission";cur=BYID[DSEQ[DIDX]];tab="detail";render();window.scrollTo(0,0)}
function msSeen(w){if(!w||backTab!=="mission"||tab!=="detail")return;const m=msToday();if(m.ids.includes(w.id)&&!m.seen.includes(w.id)){m.seen.push(w.id);persist()}}
/* 시험: 단어마다 뜻 고르기 / 독일어 고르기 / 관사 중 하나 */
let MQ=null,NOSOUND=false; /* NOSOUND: 이번에 앱을 켜 있는 동안 소리를 못 듣는 상황 */
function msBuild(){const m=msToday(),ws=m.ids.map(id=>BYID[id]).filter(Boolean),items=[];
  const others=lv=>(DATA[lv]||DATA.A1||[]);
  /* 문제 유형: 뜻 고르기(ko) · 독일어 고르기(de) · 관사(art) · 듣고 뜻 고르기(listen) · 직접 쓰기(spell) — 쓰기·듣기는 꼭 섞어요 */
  const order=ws.sort(()=>Math.random()-.5),n=order.length,nSpell=Math.max(1,Math.round(n*.3)),nListen=Math.max(1,Math.round(n*.2));
  order.forEach((w,k)=>{const art=(w.de.match(/^(der|die|das) /)||[])[1];let t;
    if(k<nSpell&&w.de.length<=24)t="spell";else if(k<nSpell+nListen&&!NOSOUND)t="listen";else{const types=["ko","de"];if(art)types.push("art");t=types[Math.random()*types.length|0]}
    if(t==="spell"){items.push({w,t});return}
    if(t==="art"){const opts=["der","die","das"];items.push({w,t,opts,ans:opts.indexOf(art)});return}
    const pool=others(w.lv).filter(x=>x.id!==w.id&&x.ko);const opts=[w];let g=0;while(opts.length<4&&pool.length>4&&g++<200){const x=pool[Math.random()*pool.length|0];if(!opts.some(o=>o.id===x.id||shortKo(o)===shortKo(x)))opts.push(x)}
    const sh=opts.sort(()=>Math.random()-.5);items.push({w,t,opts:sh.map(x=>t==="de"?x.de:shortKo(x)),ans:sh.indexOf(w)})});
  items.sort(()=>Math.random()-.5);
  MQ={items,i:0,c:0,wrong:[],pick:null,done:false}}
function msSpellHint(w){const a=(w.de.match(/^(der|die|das) /)||[])[1],st=w.de.replace(/^(der|die|das) /,"");return (a?a+" ":"")+st[0]+" "+"_ ".repeat(Math.max(0,st.length-1)).trim()}
function msCheckSpell(){if(!MQ||MQ.pick!=null||MQ.done)return;const q=MQ.items[MQ.i],el=$("#mqin");if(!el||!normIn(el.value)){toast("나머지 철자를 써 주세요");return}
  const r=spellCheck(q.w,el.value);q.typed=r.full;q.note=r.note;mqAnswer(r.ok?0:-1,0)}
function viewMTest(){if(!MQ)msBuild();const q=MQ.items[MQ.i],n=MQ.items.length;
  if(MQ.done){const sc=Math.round(MQ.c/n*100),ok=sc>=MPASS;
    return `<div class="msres ${ok?"pass":"fail"}"><p>${ok?"미션 성공!":"아쉬워요, 조금만 더!"}</p><b>${sc}<small>점</small></b><span>${MQ.c} / ${n} 정답 · 통과 기준 ${MPASS}점</span></div>
    ${MQ.wrong.length?`<h3 class="obh3">틀린 단어</h3><div class="mslist">${MQ.wrong.map(w=>`<button data-open="${w.id}"><span lang="de">${headword(w.de)}</span><small>${esc(shortKo(w))}</small></button>`).join("")}</div>
      <button class="ghost" data-msstarwrong="1" style="width:100%;margin-top:8px">☆ 틀린 단어 북마크하기</button>`:""}
    <div class="msacts">${ok?`<button class="primary" data-tab="home">처음 화면으로</button>`:`<button class="primary" data-msretry="1">틀린 단어 다시 보고 재도전</button><button class="ghost" data-mstest="1">바로 다시 시험</button>`}</div>`}
  const ask=q.t==="ko"?"알맞은 뜻은?":q.t==="de"?"독일어로는?":q.t==="listen"?"듣고 알맞은 뜻을 고르세요":q.t==="spell"?"독일어로 써 보세요":"알맞은 관사는?";
  if(q.t==="listen"&&MQ.said!==MQ.i){MQ.said=MQ.i;setTimeout(()=>{try{speak(q.w.de)}catch(e){}},250)}
  if(q.t==="spell"){const done=MQ.pick!=null,ok=MQ.pick===0;
    return `<div class="obprog"><span style="width:${MQ.i/n*100}%"></span></div><p class="obcount">미션 시험 · ${MQ.i+1} / ${n}</p>
    <article class="card qz"><p class="qask" style="margin-top:0">${ask}</p><div class="qko">${esc(shortKo(q.w))}</div>
    ${done?`<p class="qtyped ${ok?"ok":"bad"}">${esc(q.typed||"")}</p>${ok?"":`<p class="msans">정답 <b lang="de">${headword(q.w.de)}</b></p>`}${q.note?`<p class="hint">${esc(q.note)}</p>`:""}`
    :spellBox(q.w,"mqin",'id="mqCheck" data-mqcheck="1"')+`<button class="obskip" data-mqgive="1" style="width:100%">모르겠어요</button>`}</article>`}
  return `<div class="obprog"><span style="width:${MQ.i/n*100}%"></span></div><p class="obcount">미션 시험 · ${MQ.i+1} / ${n}</p>
   <article class="card qz"><p class="qask" style="margin-top:0">${ask}</p>${q.t==="listen"?`<button class="mslisten" data-mqsay="1" aria-label="다시 듣기">🔊<small>다시 듣기</small></button>`:q.t==="de"?`<div class="qko">${esc(shortKo(q.w))}</div>`:q.t==="art"?`<h1 class="word" lang="de"><span class="artq">___</span> ${esc(q.w.de.replace(/^(der|die|das) /,""))}</h1><p class="qko2">${esc(shortKo(q.w))}</p>`:`<h1 class="word" lang="de">${headword(q.w.de)}</h1>`}
   <div class="${q.t==="art"?"qarts":"qopts"}">${q.opts.map((x,i)=>`<button class="${q.t==="art"?"qa-"+x:"qopt"}${MQ.pick!=null?(i===q.ans?" ok":i===MQ.pick?" bad":" dim"):""}" data-mqa="${i}" ${q.t==="de"||q.t==="art"?'lang="de"':""}>${q.t==="de"?headword(x):esc(x)}</button>`).join("")}</div>${q.t==="listen"&&MQ.pick!=null?`<p class="msans" lang="de">${headword(q.w.de)}</p>`:""}${q.t==="listen"&&MQ.pick==null?`<button class="mute" data-mqmute="1">🔇 지금은 소리를 들을 수 없어요</button>`:""}</article>`}
function mqAnswer(i){if(!MQ||MQ.pick!=null||MQ.done)return;const q=MQ.items[MQ.i];const ok=q.t==="spell"?i===0:i===q.ans;MQ.pick=i;
  if(ok){MQ.c++;sfx("doneSound")}else{MQ.wrong.push(q.w);try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}
  try{srsRate(q.w.id,ok?2:0)}catch(e){}render();
  setTimeout(()=>{MQ.pick=null;MQ.i++;if(MQ.i>=MQ.items.length){MQ.done=true;msRecord()}render();window.scrollTo(0,0);const e=$("#mqin");if(e)e.focus()},ok?(q.t==="spell"?900:600):(q.t==="spell"?2000:1300))}
function msRecord(){const m=msToday(),n=MQ.items.length,sc=Math.round(MQ.c/n*100),ok=sc>=MPASS,k=m.date;
  m.tries=(m.tries||0)+1;m.best=Math.max(m.best||0,sc);if(ok)m.pass=true;
  S.mh=S.mh||{};const h=S.mh[k]||{n,score:0,pass:false,tries:0};h.n=n;h.score=Math.max(h.score||0,sc);h.pass=h.pass||ok;h.tries=(h.tries||0)+1;S.mh[k]=h;
  const ks=Object.keys(S.mh).sort();if(ks.length>400)ks.slice(0,ks.length-400).forEach(x=>delete S.mh[x]);
  persist();if(ok){fxPlay(tadaSound);native({type:"missionDone",date:k})}}
function msClick(b){const d=b.dataset;
  if(d.strange){STR=+d.strange;render();return true}
  if(d.msopen!==undefined){msOpen(+d.msopen);return true}
  if(d.mstest){MQ=null;msBuild();tab="mtest";render();window.scrollTo(0,0);return true}
  if(d.mqa!==undefined){mqAnswer(+d.mqa);return true}
  if(d.mqcheck){msCheckSpell();return true}
  if(d.mqgive){const q=MQ&&MQ.items[MQ.i];if(q){q.typed="";mqAnswer(-1)}return true}
  if(d.mqmute){NOSOUND=true;try{AUD&&AUD.pause&&AUD.pause()}catch(e){}if(MQ)MQ.items.forEach((x,i)=>{if(x.t==="listen"&&i>=MQ.i)x.t="ko"});toast("소리 없이 풀 수 있는 문제로 바꿨어요");render();return true}
  if(d.mqsay){const q=MQ&&MQ.items[MQ.i];if(q)speak(q.w.de);return true}
  if(d.msretry){const ids=MQ.wrong.map(w=>w.id);DSEQ=ids.length?ids:msToday().ids.slice();DIDX=0;backTab="mission";cur=BYID[DSEQ[0]];tab="detail";render();window.scrollTo(0,0);return true}
  if(d.msstarwrong){let a=0;MQ.wrong.forEach(w=>{if(!S.star.includes(w.id)&&!doneSet().has(w.id)){S.star.push(w.id);a++}});persist();toast(a?`북마크에 ${a}개 담았어요`:"이미 담겨 있어요");render();return true}
  if(d.msgo){const m=msToday();if(m.pass){go("mission");return true}if(msStage(m)==="test"){MQ=null;msBuild();tab="mtest";render();window.scrollTo(0,0);return true}msOpen(Math.max(0,m.ids.findIndex(id=>!m.seen.includes(id))));return true}
  if(d.obopen){obStart();return true}
  return false}

/* ================= 통계 (Statistik) ================= */
/* 하루 기록 요약: 날짜 → [넘긴 카드, 학습 초, 외운 단어 수] — 400일 보관 (dl은 40일만 보관) */
function histAll(){const h=Object.assign({},(S.hist&&typeof S.hist==="object")?S.hist:{});
  Object.entries(S.dl||{}).forEach(([k,v])=>{if(!v)return;const o=Array.isArray(h[k])?h[k]:[0,0,0];h[k]=[Math.max(+o[0]||0,+v.n||0),Math.max(+o[1]||0,+v.t||0),Math.max(+o[2]||0,(v.di||[]).length)]});
  const ks=Object.keys(h).sort();if(ks.length>400)ks.slice(0,ks.length-400).forEach(k=>delete h[k]);return h}
function syncHist(){try{S.hist=histAll()}catch(e){}}
function histMerge(d){if(!d||!d.hist||typeof d.hist!=="object")return;const h=S.hist||{};
  Object.entries(d.hist).forEach(([k,v])=>{if(!Array.isArray(v))return;const o=h[k]||[0,0,0];h[k]=[0,1,2].map(i=>Math.max(+o[i]||0,+v[i]||0))});S.hist=h}

let STR=30; /* 그래프 기간: 7 · 30 · 90일 */
const fmtN=n=>Math.round(n).toLocaleString("ko-KR");
function fmtDur(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}<em>시간</em> ${m}<em>분</em>`:`${m}<em>분</em>`}
function fmtDurT(sec){const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}시간 ${m}분`:`${m}분`}
function dayLabel(k){const d=new Date(k+"T12:00:00");return `${d.getMonth()+1}월 ${d.getDate()}일 (${"일월화수목금토"[d.getDay()]})`}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);out.push(dkey(x))}return out}
function bestRun(keys){const s=[...new Set(keys)].sort();let best=0,run=0,prev=null;
  s.forEach(k=>{const d=new Date(k+"T12:00:00");if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;best=Math.max(best,run);prev=d});return best}
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const MILES=[50,100,250,500,1000,1500,2000,3000,4000,5000,7500,10000,15000];

function statData(){const h=histAll(),keys=Object.keys(h).sort(),mh=S.mh||{},sr=S.srs||{};
  const sum=(ks,i)=>ks.reduce((a,k)=>a+((h[k]||[])[i]||0),0);
  const d7=lastDays(7),p7=lastDays(14).slice(0,7);
  const mk=Object.keys(mh).sort(),passK=mk.filter(k=>mh[k].pass),scores=mk.map(k=>mh[k].score).filter(x=>x!=null);
  let bestDay=null;keys.forEach(k=>{if(!bestDay||h[k][0]>h[bestDay][0])bestDay=k});
  const mem=[0,0,0,0];Object.values(sr).forEach(r=>{const iv=+r[1]||0;mem[iv<1?0:iv<7?1:iv<21?2:3]++});
  const first=[keys[0],(S.qd||[]).slice().sort()[0],S.plan&&S.plan.date].filter(Boolean).sort()[0]||dkey(new Date());
  const days=Math.max(1,Math.round((new Date(dkey(new Date())+"T12:00:00")-new Date(first+"T12:00:00"))/864e5)+1);
  const studied=keys.filter(k=>h[k][0]>0||h[k][1]>=60).length;
  return {h,keys,mh,mk,passK,scores,mem,first,days,studied,bestDay,
    wkCards:sum(d7,0),pwCards:sum(p7,0),wkDone:sum(d7,2),wkSec:sum(d7,1),
    cards:sum(keys,0),done:S.done.length,seen:(S.lw||[]).length,
    streak:streak(),bestStreak:Math.max(streak(),bestRun(S.qd||[])),
    msRun:msStats().run,msBest:bestRun(passK)}}

function tipAttr(s){return `data-tip="${esc(s)}" tabindex="0"`}

/* 히트맵: 지난 17주, 하루 넘긴 카드 수를 5단계로 */
function heatSVG(d,W){const weeks=17,gap=3,lab=18,cell=Math.max(10,Math.min(18,Math.floor((W-lab-weeks*gap)/weeks))),H=lab+7*(cell+gap);
  const end=new Date();end.setHours(12,0,0,0);const start=new Date(end);start.setDate(end.getDate()-end.getDay()-7*(weeks-1));
  const lvl=n=>n<=0?0:n<10?1:n<30?2:n<60?3:4;let out="",lastM=-1,lastPx=-99;
  for(let w=0;w<weeks;w++)for(let r=0;r<7;r++){const x=new Date(start);x.setDate(start.getDate()+w*7+r);if(x>end)continue;const k=dkey(x),v=d.h[k]||[0,0,0],L=lvl(v[0]),
      px=lab+w*(cell+gap),py=lab+r*(cell+gap),ms=d.mh[k]&&d.mh[k].pass;
    if(r===0&&x.getMonth()!==lastM){lastM=x.getMonth();if(px-lastPx>=24){lastPx=px;out+=`<text x="${px}" y="11" class="axt">${x.getMonth()+1}월</text>`}}
    out+=`<rect x="${px}" y="${py}" width="${cell}" height="${cell}" rx="3" class="hq${L}${k===dkey(new Date())?" today":""}" ${tipAttr(`${v[0]}장 · ${fmtDurT(v[1])}${ms?" · ★ 미션 성공":""}\n${dayLabel(k)}`)}/>`}
  ["","월","","수","","금",""].forEach((t,r)=>{if(t)out+=`<text x="0" y="${lab+r*(cell+gap)+cell-3}" class="axt">${t}</text>`});
  return `<svg class="stsvg" width="${lab+weeks*(cell+gap)}" height="${H}" viewBox="0 0 ${lab+weeks*(cell+gap)} ${H}" role="img" aria-label="지난 17주 학습 기록">${out}</svg>`}

/* 날마다 넘긴 카드 (막대) */
function barsSVG(d,W){const ks=lastDays(STR),vals=ks.map(k=>(d.h[k]||[0])[0]),H=150,top=18,bot=22,left=30,pw=W-left-4,slot=pw/ks.length,bw=Math.max(2,Math.min(24,slot-2)),
    mx=niceMax(Math.max(10,...vals)),y=v=>top+(H-top-bot)*(1-v/mx);let g="";
  [0,mx/2,mx].forEach(t=>{g+=`<line x1="${left}" x2="${W}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${left-6}" y="${y(t)+4}" class="axt" text-anchor="end">${fmtN(t)}</text>`});
  const iMax=vals.indexOf(Math.max(...vals));
  ks.forEach((k,i)=>{const v=vals[i],x=left+i*slot+(slot-bw)/2,y0=H-bot,yt=y(v),r=Math.min(4,bw/2,(y0-yt));const ms=d.mh[k]&&d.mh[k].pass;
    if(v>0)g+=`<path d="M${x},${y0}V${yt+r}Q${x},${yt} ${x+r},${yt}H${x+bw-r}Q${x+bw},${yt} ${x+bw},${yt+r}V${y0}Z" class="bar${k===dkey(new Date())?" now":""}"/>`;
    if(ms&&STR<=30)g+=`<text x="${x+bw/2}" y="${Math.min(yt,y0)-4}" class="star" text-anchor="middle">★</text>`;
    g+=`<rect x="${left+i*slot}" y="${top-14}" width="${slot}" height="${H-top-bot+14}" class="hit" ${tipAttr(`${v}장 · ${fmtDurT((d.h[k]||[0,0])[1])}${ms?" · ★ 미션 성공":""}\n${dayLabel(k)}`)}/>`;
    if(i===iMax&&v>0&&!(ms&&STR<=30))g+=`<text x="${x+bw/2}" y="${yt-5}" class="vlab" text-anchor="middle">${v}</text>`});
  const lab=i=>{const d0=new Date(ks[i]+"T12:00:00");return `${d0.getMonth()+1}/${d0.getDate()}`};
  [0,Math.floor((ks.length-1)/2),ks.length-1].forEach((i,j)=>{g+=`<text x="${left+i*slot+slot/2}" y="${H-6}" class="axt" text-anchor="${j===0?"start":j===2?"end":"middle"}">${i===ks.length-1?"오늘":lab(i)}</text>`});
  g+=`<line x1="${left}" x2="${W}" y1="${H-bot}" y2="${H-bot}" class="axis"/>`;
  return `<svg class="stsvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 ${STR}일 날마다 넘긴 카드 수">${g}</svg>`}

/* 미션 점수 (선) + 통과선 80점 */
function scoreSVG(d,W){const ks=lastDays(STR),pts=ks.map((k,i)=>[i,d.mh[k]]).filter(p=>p[1]&&p[1].score!=null),H=150,top=14,bot=22,left=30,pw=W-left-30,
    x=i=>left+(ks.length===1?pw/2:i*pw/(ks.length-1)),y=v=>top+(H-top-bot)*(1-v/100);let g="";

/* 툴팁: 값이 먼저, 설명은 아래 — 내용은 textContent로 넣어요 */
function stTip(el){let t=$("#sttip");if(!el){if(t)t.hidden=true;return}if(!t){t=document.createElement("div");t.id="sttip";t.setAttribute("role","tooltip");document.body.appendChild(t)}const [a,...b]=String(el.dataset.tip||"").split("\n");
  t.textContent="";const s=document.createElement("strong");s.textContent=a;t.appendChild(s);if(b.length){const sm=document.createElement("span");sm.textContent=b.join(" ");t.appendChild(sm)}
  t.hidden=false;const r=el.getBoundingClientRect(),tw=t.offsetWidth,th=t.offsetHeight;let x=r.left+r.width/2-tw/2,y=r.top-th-8;
  x=Math.max(8,Math.min(innerWidth-tw-8,x));if(y<8)y=r.bottom+8;t.style.left=x+"px";t.style.top=y+"px"}
document.addEventListener("pointerover",e=>{if(tab!=="stats")return;const el=e.target.closest&&e.target.closest("[data-tip]");stTip(el||null)});
document.addEventListener("focusin",e=>{if(tab!=="stats")return;const el=e.target.closest&&e.target.closest("[data-tip]");if(el)stTip(el)});

<script>
/* ---------- 시작 화면 (앱을 열 때 한 번) ---------- */
(function(){
  const sp=document.createElement("div");sp.id="splash";sp.setAttribute("role","presentation");
  sp.innerHTML='<svg class="pksp" viewBox="0 0 220 240" aria-hidden="true"><g class="pktk"><g transform="translate(110 88) rotate(-8)"><rect x="-40" y="-52" width="80" height="104" rx="11" fill="#DD0000"/><text x="0" y="22" text-anchor="middle" font-family="Georgia,\'Times New Roman\',serif" font-weight="700" font-size="64" fill="#FFCE00">Ä</text></g></g><g class="pkpo"><path d="M18 120 H202 V168 Q202 228 110 232 Q18 228 18 168 Z" fill="#FFFFFF"/><path class="pkst" d="M32 134 H188 V166 Q188 214 110 218 Q32 214 32 166 Z" fill="none" stroke="#151515" stroke-width="2.5" stroke-dasharray="6 6"/></g></svg><div class="splt"><b>포켓<span>독일어</span></b><small>주머니 속 독일어 단어장<br>A1–C2 · 17,780단어</small><div class="spfl"><i style="background:#3a3a3a"></i><i style="background:#DD0000"></i><i style="background:#FFCE00"></i></div></div><p class="sptap">화면을 누르면 시작해요 ›</p>';
  document.body.appendChild(sp);
  let gone=false,played=false;
  function chime(ctx){ /* 맑고 부드럽게 올라가는 네 음 (G–B–D–G) */
    if(played||!ctx)return;played=true;try{
      const t0=ctx.currentTime+0.02,out=ctx.createGain();out.gain.value=0.16;out.connect(ctx.destination);
      [[784,0],[987.8,.09],[1174.7,.18],[1568,.3]].forEach(([f,d],i)=>{const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),t=t0+d;
        o.type="sine";o.frequency.value=f;o2.type="sine";o2.frequency.value=f*2;g2.gain.value=.12;
        g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(i===3?.9:.7,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+(i===3?1.6:0.9));
        o.connect(g);o2.connect(g2).connect(g);g.connect(out);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7)})}catch(e){}}
  function ctxNow(){if(!(typeof PREF!=="undefined"&&PREF.snd))return null;try{audioInit();return ACX}catch(e){return null}}
  function close(withSound){if(gone)return;gone=true;
    if(withSound&&!played&&typeof PREF!=="undefined"&&PREF.snd){played=true;try{if(!htmlFx("splash")){const c=ctxNow();if(c){played=false;if(c.state!=="running")c.resume().then(()=>chime(c)).catch(()=>{});else chime(c)}}}catch(e){}}
    sp.classList.add("out");setTimeout(()=>sp.remove(),900)}
  sp.addEventListener("click",e=>{e.preventDefault();close(true)});
  /* 소리가 바로 허용되는 환경이면 스르르 사라질 때 함께 울려요 (아이폰 등은 화면을 눌러야 소리가 나요) */
  /* 화면을 누르면 효과음과 함께 사라져요 (자동으로 넘어가지 않아요) */
})();

/* 접근성: role="button" 요소도 Enter·스페이스로 누를 수 있게 · 툴팁 정보(data-tip)를 화면 읽기에 전달 */
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.getAttribute&&e.target.getAttribute("role")==="button"&&e.target.tagName!=="BUTTON"){e.preventDefault();e.target.click()}});

</script>

.pgsheet p{margin:0 0 18px;color:var(--muted,#5E6878);font-size:15.5px;line-height:1.6}

.pgsheet .pgbtns>*{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer}
.pgsheet .pgstore{background:#151515;color:#fff}.pgsheet .pgstore[aria-disabled]{opacity:.55;cursor:default}
.pgsheet .pgkeep{background:var(--accent,#2D5BD3);color:var(--accent-ink,#fff)}
.pgsheet .pghome{background:transparent;color:var(--muted,#5E6878);min-height:40px!important;font-size:14.5px!important}
@keyframes pgIn{from{opacity:0}to{opacity:1}}
</style><script>
/* Pocket German web trial: A1 + topic words are free; other levels open a sheet that points to the app */
(function(){
  var FREE=["A1"],T={"name": "포켓독일어", "badge": "웹 체험판", "intro_h": "포켓독일어 웹 체험판", "intro_p": "A1 단어 845개와 199개 주제의 단어를 무료로 써 볼 수 있어요. A2부터 C2까지 모든 레벨과 미션 기록은 앱에서 열려요.", "start": "체험 시작하기", "lock_h": "이 레벨은 앱에서 열려요", "lock_p": "A2부터 C2까지 17,780단어 전체, 매일 미션과 복습 기록은 포켓독일어 앱에서 쓸 수 있어요. 웹 체험판에서는 A1 단어와 주제별 단어를 계속 무료로 써 보세요.", "store": "App Store에서 받기", "soon": "App Store 곧 출시", "keep": "A1로 계속하기", "home": "포켓독일어 홈"},STORE="",HOME="/german/";
  var SEL='[data-lv],[data-lvc],[data-lvsel],[data-qlv],[data-q],[data-pref="mlv"]';
  function val(b){var d=b.dataset;return d.lv||d.lvc||d.lvsel||d.qlv||d.q||(d.pref==="mlv"?d.val:"")||""}
  function locked(b){var v=val(b);if(!v||v==="blog")return false;return v.split(",").some(function(x){return FREE.indexOf(x)<0})}
  function sheet(h,p,first){
    if(document.querySelector(".pgsheet"))return;
    var s=document.createElement("div");s.className="pgsheet";s.setAttribute("role","dialog");s.setAttribute("aria-modal","true");
    var store=STORE?'<a class="pgstore" href="'+STORE+'" rel="noopener">'+T.store+'</a>':'<span class="pgstore" aria-disabled="true">'+T.soon+'</span>';
    s.innerHTML='<div><span class="pgb">'+T.badge+'</span><h2>'+h+'</h2><p>'+p+'</p><div class="pgbtns">'+(first?'<button class="pgkeep" type="button">'+T.start+'</button>'+store:store+'<button class="pgkeep" type="button">'+T.keep+'</button>')+'<a class="pghome" href="'+HOME+'">'+T.home+'</a></div></div>';
    document.body.appendChild(s);
    var close=function(){s.remove()};
    s.addEventListener("click",function(e){if(e.target===s||e.target.closest(".pgkeep"))close()});
    document.addEventListener("keydown",function k(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",k)}});
    var f=s.querySelector(".pgkeep");if(f)f.focus();
  }
  function pay(){sheet(T.lock_h,T.lock_p)}
  document.addEventListener("click",function(e){var b=e.target.closest(SEL);if(b&&locked(b)){e.preventDefault();e.stopImmediatePropagation();pay()}},true);
  function sanitize(){var bad=false;
    try{if(typeof S!=="undefined"&&S&&Array.isArray(S.levels)){var keep=S.levels.filter(function(x){return FREE.indexOf(x)>=0});
      if(keep.length!==S.levels.length){bad=lvMode!=="blog";S.levels=keep.length?keep:["A1"];try{persist()}catch(x){}}}
      if(typeof PREF!=="undefined"&&PREF){if(PREF.mlv&&FREE.indexOf(PREF.mlv)<0)PREF.mlv="A1";
        if(Array.isArray(PREF.qlv)){var q=PREF.qlv.filter(function(x){return FREE.indexOf(x)>=0});PREF.qlv=q.length?q:["A1"]}}}catch(x){}
    if(bad&&armed)setTimeout(pay,300)}
  var armed=false;document.addEventListener("pointerdown",function(){armed=true},{capture:true,once:true});
  if(typeof window.render==="function"){var _r=window.render;window.render=function(){sanitize();return _r.apply(this,arguments)}}
  function lockAll(root){(root||document).querySelectorAll(SEL).forEach(function(b){if(locked(b)){if(!b.classList.contains("pglock")){b.classList.add("pglock");b.setAttribute("aria-description",T.lock_h)}}})}
  new MutationObserver(function(){lockAll()}).observe(document.body,{childList:true,subtree:true});
  sanitize();lockAll();
  /* no intro sheet of our own: the app runs its own first-time onboarding */
})();
</script></body></html>
