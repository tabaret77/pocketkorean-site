name: Notify search engines (IndexNow)
on:
  push:
    branches: [main]
    paths: ['content/articles/**']
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Submit new and changed articles
        run: |
          files=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- content/articles || true)
          echo "$files"
          python3 tools/indexnow.py $files
