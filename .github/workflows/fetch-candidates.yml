name: Fetch cover photo candidates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd tools && python3 fetch_candidates.py
      - name: Commit candidates to the media-candidates branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b media-candidates
          git add media/candidates
          git commit -m "Cover photo candidates"
          git push -f origin media-candidates
